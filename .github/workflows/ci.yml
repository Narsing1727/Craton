name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: craton
          POSTGRES_PASSWORD: craton
          POSTGRES_DB: craton
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U craton -d craton"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The whole suite twice: on the PostgreSQL that runs inside the process (what a development checkout uses), and on a real server
      # (each test database gets its own schema there).
      - name: Tests (in-process PostgreSQL)
        run: npm test
      - name: Tests (PostgreSQL server and Redis)
        run: npm test
        env:
          CRATON_TEST_PG: postgres://craton:craton@localhost:5432/craton
          CRATON_TEST_REDIS: redis://localhost:6379

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # `npm install`, not `npm ci`: the lock file lists only some platforms' optional native packages (see frontend/Dockerfile).
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
