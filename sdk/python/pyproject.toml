[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "craton-client"
version = "0.1.0"
description = "A small client for the Craton API: versioned geospatial and hydrology data, no dependencies."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
fsspec = ["fsspec>=2023.1"]

[project.entry-points."fsspec.specs"]
craton = "craton_fsspec:CratonFileSystem"

[tool.setuptools]
py-modules = ["craton", "craton_fsspec"]
